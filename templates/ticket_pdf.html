<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bus Ticket</title>
    <style>
        /* PDF ko lagi standard margin ra font css */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }
        .ticket-box {
            border: 2px dashed #000;
            padding: 20px;
            width: 100%;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .info-table {
            width: 100%;
            margin-top: 20px;
        }
        .info-table td {
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="ticket-box">
        <div class="header">
            <h2>YATAYAT BUS BOOKING</h2>
            <p>Official Travel Ticket</p>
        </div>

        <table class="info-table">
            <tr>
                <td><strong>Passenger Name:</strong> {{ name }}</td>
                <td><strong>Seat Number:</strong> {{ seat_no }}</td>
            </tr>
            <tr>
                <td><strong>From:</strong> {{ source }}</td>
                <td><strong>To:</strong> {{ destination }}</td>
            </tr>
            <tr>
                <td><strong>Date:</strong> {{ travel_date }}</td>
                <td><strong>Price:</strong> Rs. {{ price }}</td>
            </tr>
        </table>
    </div>

</body>
</html>
